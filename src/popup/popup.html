<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Saver</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header -->
      <header class="app-header">
        <div class="brand">
          <img
            src="../icons/icon48.png"
            alt="Session Saver Logo"
            class="brand-icon"
            width="24"
            height="24"
          />
          <h1 class="brand-title">Session Saver</h1>
        </div>
      </header>

      <!-- Notification Toast / Feedback Banner -->
      <div
        id="statusMessage"
        class="status-banner"
        role="status"
        aria-live="polite"
      ></div>

      <!-- Save Session Form -->
      <section class="save-section" aria-label="Save current session">
        <div class="input-group">
          <input
            type="text"
            id="sessionNameInput"
            class="input-field"
            placeholder="Session name (optional)..."
            maxlength="60"
            autocomplete="off"
          />
          <button
            id="saveBtn"
            class="btn btn-primary"
            type="button"
            title="Save open tabs"
          >
            <svg
              class="btn-icon"
              viewBox="0 0 20 20"
              fill="currentColor"
              width="16"
              height="16"
            >
              <path
                d="M7.707 10.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l6-6a1 1 0 00-1.414-1.414L11 12.586l-2.293-2.293z"
              />
              <path
                d="M5 3a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2V7.414A2 2 0 0016.414 6L14 3.586A2 2 0 0012.586 3H5zm7 2v2H6V5h6z"
              />
            </svg>
            <span>Save</span>
          </button>
        </div>
      </section>

      <!-- Search & Backup Toolbar -->
      <div class="toolbar-section">
        <div class="search-container" id="searchContainer">
          <svg
            class="search-icon"
            viewBox="0 0 20 20"
            fill="currentColor"
            width="14"
            height="14"
          >
            <path
              fill-rule="evenodd"
              d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
              clip-rule="evenodd"
            />
          </svg>
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Search saved sessions..."
            autocomplete="off"
            aria-label="Search saved sessions"
          />
        </div>
        <div class="backup-toolbar">
          <button
            id="exportBtn"
            class="btn-tool"
            type="button"
            title="Export all sessions as a JSON backup"
            aria-label="Export sessions as JSON"
          >
            <svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13">
              <path
                fill-rule="evenodd"
                d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
            <span>Export</span>
          </button>
          <button
            id="importBtn"
            class="btn-tool"
            type="button"
            title="Import sessions from a JSON backup file"
            aria-label="Import sessions from JSON"
          >
            <svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13">
              <path
                fill-rule="evenodd"
                d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z"
                clip-rule="evenodd"
              />
            </svg>
            <span>Import</span>
          </button>
          <input
            type="file"
            id="importFileInput"
            accept=".json,application/json"
            style="display: none"
          />
        </div>
      </div>

      <!-- Saved Sessions Container -->
      <section class="sessions-section" aria-label="Saved sessions list">
        <div class="section-header">
          <h2 class="section-title">Saved Sessions</h2>
          <span id="sessionCounter" class="badge">0</span>
        </div>

        <!-- Dynamic Sessions List -->
        <div id="sessionsList" class="sessions-list" role="list"></div>
      </section>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
